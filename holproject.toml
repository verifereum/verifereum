[holbuild]
minimum_version = "0.12.0"

[project]
name = "verifereum"
version = "1.0.3"

[build]
roots = ["verifereumScript.sml"]

[build.groups.tests]
include = ["tests/defs", "tests/results"]

[[executable]]
name = "runtests"
output = "tests/runtests.exe"
objects = ["runtests"]

[[executable]]
name = "runtests_unchecked"
output = "tests/runtests_unchecked.exe"
objects = ["runtests_unchecked"]

[actions.vfmUncheckedFixtureLib]
deps = ["vfmUncheckedEmitTheory"]

[dependencies.hol]
git = "https://github.com/HOL-Theorem-Prover/HOL.git"
rev = "9783a49979c94c401ff8c0e51b2eefae7ea95ae3"

[dependencies.holexamples]
from = "hol"
path = "."
manifest = "holexamples.manifest.toml"
