[holbuild]
schema = 2
minimum_version = "0.8.2"

[project]
name = "verifereum"
version = "1.0.1"

[build]
roots = ["verifereumScript.sml"]
exclude = ["tests/defs", "tests/results"]
tactic_timeout = 30

[dependencies.hol]
git = "https://github.com/HOL-Theorem-Prover/HOL.git"
rev = "bf1d6b1a4f4f9dfae56705a3097d92fa106a2d01"

[dependencies.holexamples]
from = "hol"
path = "."
manifest = "holexamples.manifest.toml"
