[holbuild]
minimum_version = "0.11.2"

[project]
name = "verifereum"
version = "1.0.3"

[build]
roots = ["verifereumScript.sml"]
tactic_timeout = 30

[build.groups.tests]
include = ["tests/defs", "tests/results"]

[[executable]]
name = "runtests"
output = "tests/runtests.exe"
objects = ["runtests"]

[dependencies.hol]
git = "https://github.com/HOL-Theorem-Prover/HOL.git"
rev = "6e790ab5af08da2e4e39543bc10f4ceafb99faca"

[dependencies.holexamples]
from = "hol"
path = "."
manifest = "holexamples.manifest.toml"
