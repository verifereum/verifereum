name: holmake

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml

      - name: Verify Poly/ML is executable
        run: poly -v


      - name: Get pinned HOL commit hash from holproject.toml
        id: hol4-version
        run: |
          hol4_ref="$(python3 - <<'PY'
          import tomllib
          with open("holproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["dependencies"]["hol"]["rev"])
          PY
          )"
          echo "hash=$hol4_ref" >> "$GITHUB_OUTPUT"

      - name: Restore HOL4 cache
        uses: actions/cache/restore@v6
        id: cache-hol4
        with:
          path: ~/HOL
          key: hol-${{ runner.os }}-${{ runner.arch }}-${{ steps.hol4-version.outputs.hash }}

      - name: Setup and Build HOL4
        if: steps.cache-hol4.outputs.cache-hit != 'true'
        env:
          HOL4_REF: ${{ steps.hol4-version.outputs.hash }}
        run: |
          git clone https://github.com/HOL-Theorem-Prover/HOL.git $HOME/HOL
          cd $HOME/HOL
          git checkout --detach "$HOL4_REF"
          poly --script tools/smart-configure.sml
          bin/build --no-helpdocs

      - name: Save HOL4 cache
        if: steps.cache-hol4.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/HOL
          key: hol-${{ runner.os }}-${{ runner.arch }}-${{ steps.hol4-version.outputs.hash }}

      - name: Add HOL to PATH and export HOLDIR
        run: |
          echo "$HOME/HOL/bin" >> "$GITHUB_PATH"
          echo "HOLDIR=$HOME/HOL" >> "$GITHUB_ENV"

      - name: Verify HOL is executable
        run: hol --help

      - name: Build Verifereum
        run: Holmake
