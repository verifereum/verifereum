name: holbuild

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HBX_BASENAME: verifereum
  HBX_ARTEFACT_NAME: verifereum-hbx-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - name: Get minimum holbuild version from holproject.toml
        id: holbuild-version
        run: |
          holbuild_ref="$(python3 - <<'PY'
          import tomllib
          with open("holproject.toml", "rb") as f:
              data = tomllib.load(f)
          print("v" + data["holbuild"]["minimum_version"])
          PY
          )"
          echo "ref=$holbuild_ref" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-holbuild
        id: holbuild
        with:
          holbuild-ref: ${{ steps.holbuild-version.outputs.ref }}

      - name: Report selected holbuild version
        run: holbuild --version

      - name: Configure holbuild cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      - name: Compute holbuild cache keys
        id: cache-key
        run: |
          toolchain_key="holbuild-v4-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}"
          build_prefix="holbuild-v4-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}-${{ hashFiles('holproject.toml', 'holexamples.manifest.toml') }}"
          snapshot_key="${build_prefix}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "toolchain-key=$toolchain_key" >> "$GITHUB_OUTPUT"
          echo "build-prefix=$build_prefix" >> "$GITHUB_OUTPUT"
          echo "snapshot-key=$snapshot_key" >> "$GITHUB_OUTPUT"

      - name: Restore latest compatible project snapshot
        id: cache-holbuild-project
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.build-prefix }}-

      - name: Restore holbuild toolchain cache on project snapshot miss
        id: cache-holbuild-toolchain
        if: ${{ steps.cache-holbuild-project.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Report restored holbuild cache
        env:
          PROJECT_CACHE_HIT: ${{ steps.cache-holbuild-project.outputs.cache-hit }}
          PROJECT_CACHE_KEY: ${{ steps.cache-holbuild-project.outputs.cache-matched-key }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.cache-holbuild-toolchain.outputs.cache-hit }}
          TOOLCHAIN_CACHE_KEY: ${{ steps.cache-holbuild-toolchain.outputs.cache-matched-key }}
        run: |
          echo "project cache hit: ${PROJECT_CACHE_HIT:-false}"
          echo "project cache key: ${PROJECT_CACHE_KEY:-<none>}"
          echo "toolchain cache hit: ${TOOLCHAIN_CACHE_HIT:-false}"
          echo "toolchain cache key: ${TOOLCHAIN_CACHE_KEY:-<none>}"

      - name: Build schema-2 HOL toolchain
        run: holbuild buildhol

      - name: Save holbuild toolchain cache after buildhol
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Build project with holbuild
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps

      - name: Build test runners
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          holbuild executable runtests
          holbuild executable runtests_unchecked

      - name: Check test runners
        working-directory: tests
        run: |
          ./runtests.exe --help
          ./runtests_unchecked.exe --help

      - name: Save holbuild project snapshot
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export HBX archive
        run: |
          archive="$HBX_BASENAME.hbx"
          holbuild export \
            -o "$archive" \
            --metadata-out "$archive.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload HBX artefact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.HBX_ARTEFACT_NAME }}
          path: |
            ${{ env.HBX_BASENAME }}.hbx
            ${{ env.HBX_BASENAME }}.hbx.json
            ${{ env.HBX_BASENAME }}.hbx.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Restore EEST fixtures
        uses: actions/cache@v6
        with:
          path: tests/fixtures
          key: eest-fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/vfmTestAuxLib.sml') }}

      - name: Run complete EEST suite
        working-directory: tests
        run: |
          /usr/bin/time \
            -o "$RUNNER_TEMP/eest-time.txt" \
            -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            ./runtests_unchecked.exe -f -j"$(nproc)"

      - name: Write EEST job summary
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import collections
          import os
          from pathlib import Path

          results = []
          malformed = []
          for path in sorted(Path("tests/results").glob("result*.nsv")):
              fields = path.read_text().splitlines()
              if len(fields) != 3:
                  malformed.append(str(path))
                  continue
              try:
                  seconds = float(fields[2])
              except ValueError:
                  malformed.append(str(path))
                  continue
              results.append((fields[1], seconds))

          counts = collections.Counter(status for status, _ in results)
          timing_path = Path(os.environ["RUNNER_TEMP"]) / "eest-time.txt"
          timing = timing_path.read_text().strip() if timing_path.exists() else "unavailable"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## EEST conformance run\n\n")
              summary.write(f"- Result files: **{len(results)}**\n")
              summary.write(f"- Aggregate case time: **{sum(s for _, s in results):.2f}s**\n")
              summary.write(f"- Malformed result files: **{len(malformed)}**\n\n")
              summary.write("| Result | Cases |\n| --- | ---: |\n")
              for status, count in sorted(counts.items()):
                  summary.write(f"| {status} | {count} |\n")
              summary.write("\n```text\n" + timing + "\n```\n")
              if malformed:
                  summary.write("\nMalformed files:\n\n")
                  summary.writelines(f"- `{path}`\n" for path in malformed)
          PY

      - name: Upload EEST results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eest-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/results/result*.nsv
            tests/results/table.html
            ${{ runner.temp }}/eest-time.txt
          if-no-files-found: warn
          retention-days: 30
