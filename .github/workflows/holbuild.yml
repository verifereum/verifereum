name: holbuild

on:
  workflow_dispatch:
    inputs:
      skip-snapshot:
        description: 'Start without the Actions cache project snapshot, so theories come from the remote cache or are built'
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  # Only a PR's runs share a group; runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HBX_BASENAME: verifereum
  HBX_ARTEFACT_NAME: verifereum-hbx-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - name: Get minimum holbuild version from holproject.toml
        id: holbuild-version
        run: |
          holbuild_ref="$(python3 - <<'PY'
          import tomllib
          with open("holproject.toml", "rb") as f:
              data = tomllib.load(f)
          print("v" + data["holbuild"]["minimum_version"])
          PY
          )"
          echo "ref=$holbuild_ref" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-holbuild
        id: holbuild
        with:
          holbuild-ref: ${{ steps.holbuild-version.outputs.ref }}

      - name: Report selected holbuild version
        run: holbuild --version

      - name: Configure holbuild cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      - name: Compute holbuild cache keys
        id: cache-key
        run: |
          toolchain_key="holbuild-v4-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}"
          build_prefix="holbuild-v4-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}-${{ hashFiles('holproject.toml', 'holexamples.manifest.toml') }}"
          snapshot_key="${build_prefix}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "toolchain-key=$toolchain_key" >> "$GITHUB_OUTPUT"
          echo "build-prefix=$build_prefix" >> "$GITHUB_OUTPUT"
          echo "snapshot-key=$snapshot_key" >> "$GITHUB_OUTPUT"

      - name: Restore latest compatible project snapshot
        id: cache-holbuild-project
        if: ${{ !inputs.skip-snapshot }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.build-prefix }}-

      - name: Restore holbuild toolchain cache on project snapshot miss
        id: cache-holbuild-toolchain
        # The toolchain entry holds the whole cache it was saved from, theories
        # included, so skip-snapshot skips it too.
        if: ${{ !inputs.skip-snapshot && steps.cache-holbuild-project.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Report restored holbuild cache
        env:
          PROJECT_CACHE_HIT: ${{ steps.cache-holbuild-project.outputs.cache-hit }}
          PROJECT_CACHE_KEY: ${{ steps.cache-holbuild-project.outputs.cache-matched-key }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.cache-holbuild-toolchain.outputs.cache-hit }}
          TOOLCHAIN_CACHE_KEY: ${{ steps.cache-holbuild-toolchain.outputs.cache-matched-key }}
        run: |
          echo "project cache hit: ${PROJECT_CACHE_HIT:-false}"
          echo "project cache key: ${PROJECT_CACHE_KEY:-<none>}"
          echo "toolchain cache hit: ${TOOLCHAIN_CACHE_HIT:-false}"
          echo "toolchain cache key: ${TOOLCHAIN_CACHE_KEY:-<none>}"

      # After the restores, so holbuild looks in the restored local cache first.
      # With no Actions toolchain either, buildhol restores the published HOL
      # toolchain instead of building one whose bytes no remote entry has.
      # Only runs on main, merge groups and pull requests from branches of this
      # repository get the login. Fork PRs get no secrets and build from the
      # Actions cache alone.
      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build schema-2 HOL toolchain
        run: |
          set -o pipefail
          holbuild buildhol 2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      - name: Save holbuild toolchain cache after buildhol
        # Every branch can restore main's entries, so other branches' copies
        # only fill the 10 GB cache.
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Build project with holbuild
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps 2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      - name: Verify no successful-build checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

      - name: Export HBX archive
        run: |
          archive="$HBX_BASENAME.hbx"
          holbuild export \
            -o "$archive" \
            --metadata-out "$archive.json"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload HBX artefact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.HBX_ARTEFACT_NAME }}
          path: |
            ${{ env.HBX_BASENAME }}.hbx
            ${{ env.HBX_BASENAME }}.hbx.json
            ${{ env.HBX_BASENAME }}.hbx.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Build test runners
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          {
            holbuild executable runtests
            holbuild build --skip-checkpoints --skip-proof-steps vfmUncheckedEmitTheory
            holbuild executable runtests_unchecked
          } 2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      # After the test runners: they check proof steps, which the main
      # build's entries (built with none) don't satisfy, so a snapshot
      # saved before them makes every run rebuild those theories.
      - name: Save holbuild project snapshot
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

      - name: Write holbuild cache summary
        if: ${{ always() }}
        run: |
          log="$RUNNER_TEMP/holbuild.log"
          [ -f "$log" ] || exit 0
          # Distinct lines, so a theory built twice or a key both prefetched and
          # hydrated counts once.
          count() { grep -E -- "$1" "$log" | sed -E 's/ in [0-9.]+s$//; s/^remote cache (hydrated|prefetched):/remote cache fetched:/' | sort -u | grep -c . || true; }
          {
            echo '## holbuild cache'
            echo
            if [ -n "${HOLBUILD_REMOTE_CACHE_URL:-}" ]; then
              echo 'Remote cache: on'
            else
              echo 'Remote cache: off for this run'
            fi
            echo
            echo '| | Count |'
            echo '| --- | ---: |'
            echo "| Theories built | $(count 'Theory built( |$)') |"
            echo "| Theories restored from cache | $(count 'Theory restored from cache') |"
            echo "| Entries fetched from the remote | $(count '^remote cache (hydrated|prefetched): ') |"
            echo "| Entries published to the remote | $(count '^remote cache published: ') |"
            echo "| Remote cache warnings | $(count '^holbuild: warning: .*remote') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check test runners
        working-directory: tests
        run: |
          ./runtests.exe --help
          ./runtests_unchecked.exe --help

      - name: Restore EEST fixtures
        uses: actions/cache@v6
        with:
          path: tests/fixtures
          key: eest-fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/vfmTestAuxLib.sml') }}

      - name: Run complete EEST suite
        working-directory: tests
        run: |
          /usr/bin/time \
            -o "$RUNNER_TEMP/eest-time.txt" \
            -f 'wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            ./runtests_unchecked.exe -f -j"$(nproc)"

      - name: Write EEST job summary
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import collections
          import os
          from pathlib import Path

          results = []
          malformed = []
          for path in sorted(Path("tests/results").glob("result*.nsv")):
              fields = path.read_text().splitlines()
              if len(fields) not in (3, 4) or fields[3:] not in ([], ["checked"], ["unchecked"]):
                  malformed.append(str(path))
                  continue
              try:
                  seconds = float(fields[2])
              except ValueError:
                  malformed.append(str(path))
                  continue
              results.append((fields[1], seconds))

          counts = collections.Counter(status for status, _ in results)
          timing_path = Path(os.environ["RUNNER_TEMP"]) / "eest-time.txt"
          timing = timing_path.read_text().strip() if timing_path.exists() else "unavailable"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## EEST conformance run\n\n")
              summary.write(f"- Result files: **{len(results)}**\n")
              summary.write(f"- Aggregate case time: **{sum(s for _, s in results):.2f}s**\n")
              summary.write(f"- Malformed result files: **{len(malformed)}**\n\n")
              summary.write("| Result | Cases |\n| --- | ---: |\n")
              for status, count in sorted(counts.items()):
                  summary.write(f"| {status} | {count} |\n")
              summary.write("\n```text\n" + timing + "\n```\n")
              if malformed:
                  summary.write("\nMalformed files:\n\n")
                  summary.writelines(f"- `{path}`\n" for path in malformed)
          PY

      - name: Check EEST failures against the expected list
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          expected = {
              line for line in Path("tests/expected-failures.txt").read_text().splitlines()
              if line and not line.startswith("#")
          }
          failed = set()
          for path in Path("tests/results").glob("result*.nsv"):
              name, status = (path.read_text().splitlines() + ["", ""])[:2]
              if status != "Passed":
                  failed.add(name or str(path))
          unexpected = sorted(failed - expected)
          not_failing = sorted(expected - failed)

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n## EEST expected failures\n\n")
              summary.write(f"- Failures not in `tests/expected-failures.txt`: **{len(unexpected)}**\n")
              summary.write(f"- Listed cases that did not fail (remove them from the list): **{len(not_failing)}**\n")
              for title, names in (("Unexpected failures", unexpected), ("Listed cases that did not fail", not_failing)):
                  if names:
                      summary.write(f"\n{title}:\n\n")
                      summary.writelines(f"- `{name}`\n" for name in names)
          for name in unexpected:
              print(f"::error::EEST case failed and is not in tests/expected-failures.txt: {name}")
          sys.exit(1 if unexpected else 0)
          PY

      - name: Upload EEST results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eest-results-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/results/result*.nsv
            tests/results/table.html
            ${{ runner.temp }}/eest-time.txt
          if-no-files-found: warn
          retention-days: 30
